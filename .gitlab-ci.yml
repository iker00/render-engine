stages:
  - verify

variables:
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"

verify:
  stage: verify
  image: node:22-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.19.0 --activate
    - pnpm config set store-dir "$PNPM_HOME"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm build
    - pnpm test
